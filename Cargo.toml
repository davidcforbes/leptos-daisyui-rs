[package]
name = "leptos-daisyui-rs"
description = "daisyUI Components for Leptos"
version = "0.0.4"
edition = "2024"
license = "MIT"
authors = ["noshishiRust <nopenoshishi@gmail.com>"]
readme = "README.md"
repository = "https://github.com/noshishiRust/leptos-daisyui-rs"
# Internal path-dep-only fork — NOT published to crates.io. See README "Internal
# fork (not published)" and CLAUDE.md. The crate name is owned upstream on
# crates.io and we consume five sibling path deps that have no crates.io release,
# so `cargo publish` cannot succeed and is not a goal.
publish = false

[features]
# Determinism seam for visual-regression testing (ldui-49w.2): `test_mode`
# module (query-string parsing + freeze-stylesheet injection). Off by
# default; enabled by the demo (and any other consumer driving PixelProof).
test-mode = []

[workspace]
members = [".", "xtask", "demo", "audit"]
resolver = "3"

[dependencies]
leptos = { version = "0.8" }
leptos_router = "0.8"
qrcodegen = "1.8"                       # inline-SVG QR for the TOTP-setup step
table-rs = { path = "../table-rs" }
ui-tokens = { path = "../Rust-DeskApp/crates/ui-tokens" }
ai-chat-core = { path = "../Rust-DeskApp/crates/ai-chat-core" }
# Pure identity-coherent snapshot-table reducer shared with the desktop
# (d2d-ui) and terminal (tui-daisy) faces; see doc comment in
# src/patterns/snapshot_table.rs and ldui-gzmf.
snapshot-core = { path = "../Rust-DeskApp/crates/snapshot-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Response",
    "Headers",
    "RequestInit",
    "Request",
    "Element",
    "DomRect",
    "HtmlElement",
    "HtmlCollection",
    "HtmlFormElement",
    "HtmlSelectElement",
    "NodeList",
    "Window",
    "Document",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "DragEvent",
    "DataTransfer",
    "Navigator",
    "Clipboard",
    "FileList",
    "File",
    "EventTarget",
    "Event",
    "FocusEvent",
    "MouseEvent",
    "KeyboardEvent",
    "KeyboardEventInit",
    "SubmitEvent",
    "WheelEvent",
    "MediaQueryList",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "FileReader",
    "ProgressEvent",
    "HtmlTextAreaElement",
    "ClipboardEvent",
    "CompositionEvent",
    "InputEvent",
    "DataTransferItem",
    "DataTransferItemList",
    "DocumentFragment",
    "DomStringList",
    "DomTokenList",
    "Node",
    "Range",
    "AbstractRange",
    "CharacterData",
    "Selection",
    "Text",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ResizeObserver",
    "PointerEvent",
    "EventSource",
    "MessageEvent",
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "HtmlHeadElement",
    "Location",
    "console",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
wasm-bindgen-futures = "0.4"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
petgraph = "0.8"
send_wrapper = "0.6"
editmark-mermaid = { path = "../editmark/editmark-mermaid" }
editmark-core = { path = "../editmark/editmark-core" }

[dev-dependencies]
# Visual + reactivity smoke suites (tests/visual_smoke.rs, tests/reactivity_smoke.rs).
# Drives headless Chrome against the running demo app (trunk serve, port 3010).
# C:/dev sibling checkout — same convention as the other path deps above.
pixelproof-web = { path = "../PixelProof/crates/pixelproof-web" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Style/layout audit sweep + daisyUI component-drift heuristics
# (tests/layout_audit_smoke.rs, tests/style_audit_smoke.rs) — a workspace
# member, not a C:/dev sibling checkout.
ldui-audit = { path = "audit" }
# Raw CDP input params (Input.dispatchMouseEvent) for the line-chart pointer
# journeys in tests/common/mod.rs. Version-matched to pixelproof-web's own
# chromiumoxide so the Page/command types unify.
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }

# Build-artifact size control. Without these, `target/` reached 200 GB in under
# two weeks (2026-09-19): cargo's defaults are full debug info plus incremental,
# and this repo compiles a 120-component library, ~3500 tests and ~20 browser
# suites against TWO targets (native + wasm32). Cargo never garbage-collects
# `target/`, so the only limit is disk.
#
# `line-tables-only` keeps file/line numbers in panic backtraces -- what the
# gate's failures are actually read from -- while dropping the variable-level
# debug info that a step debugger would want. `.pdb`/`.o` volume was the single
# largest contributor (103 GB of `.o`, 16 GB of `.pdb`). Use a full `debug = true`
# override on the command line for a session that genuinely needs a debugger.
#
# See `cargo xtask clean-cache`, which reclaims the regenerable caches without
# forcing a cold rebuild of third-party deps.
[profile.dev]
debug = "line-tables-only"
